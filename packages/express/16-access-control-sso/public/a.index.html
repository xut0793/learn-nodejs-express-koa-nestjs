<h1>单点登录，应用 A</h1>
<button id="req-btn">获取订单列表</button>
<ul id="list-box"></ul>

<script>
  const reqBtnEl = document.querySelector("#req-btn")
  const listBoxEl = document.querySelector("#list-box")

  reqBtnEl.addEventListener("click", (evt) => {
    evt.preventDefault()

    fetch("/api/order")
      .then(async (res) => {
        if (res.status == 403) {
          location.replace(
            `http://localhost:8080/login?service=${encodeURIComponent(
              "http://" + location.host
            )}`
          )
        } else {
          const resData = await res.json()
          const list = resData.data

          if (Array.isArray(list) && list.length) {
            let content = ""

            list.forEach((item, index) => {
              content += `<li>${index + 1}: ${
                item.account || item.mail || item.phone
              } ${item.password}</li>`
            })

            listBoxEl.innerHTML = content
          } else {
            listBoxEl.textContent = "暂无数据"
          }
        }
      })
      .catch((err) => {
        console.error(err)
        listBoxEl.textContent = err.message
      })
  })
</script>
